<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joseph in Egypt — A Bible Adventure</title>
<link rel="stylesheet" href="joseph.css">
</head>
<body>

<div id="header">
  <div id="title">Joseph in Egypt &mdash; A Bible Adventure</div>
  <div id="status-bar">
    Location: <span id="status-location">—</span>
    &nbsp;|&nbsp; Carrying: <span id="status-inv">nothing</span>
  </div>
</div>

<div id="needs-bar"></div>

<div id="output"></div>

<div id="input-row">
  <span id="prompt-label">&gt;</span>
  <input id="cmd-input" type="text" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" placeholder="type a command..." />
</div>

<div id="help-bar">
  Commands: <kbd>look</kbd> <kbd>walk north/south/east/west</kbd> <kbd>take [item]</kbd>
  <kbd>drop [item]</kbd> <kbd>inspect [item]</kbd> <kbd>inventory</kbd>
  <kbd>eat</kbd> <kbd>drink</kbd> <kbd>rest</kbd> <kbd>status</kbd> <kbd>restart</kbd> <kbd>help</kbd>
</div>

<script src="joseph.js"></script>
</body>
</html>
